    <!-- Article Hydration Script -->
    <script>
        const TMDB_API_KEY = "abdde991ce2a56652d4c0ca156db7836";

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                slug: params.get('slug'),
                type: params.get('type') || 'movie'
            };
        }

        async function loadArticle() {
            const query = getQueryParams();
            let matchedArticle = null;
            let allArticles = [];

            // 1. Fetch from articles.json
            try {
                const res = await fetch('articles.json?t=' + Date.now());
                if (res.ok) {
                    allArticles = await res.json();
                    if (Array.isArray(allArticles)) {
                        if (query.id) {
                            matchedArticle = allArticles.find(a => String(a.id) === String(query.id));
                        } else if (query.slug) {
                            matchedArticle = allArticles.find(a => a.slug === query.slug || a.slug.includes(query.slug));
                        }
                        if (!matchedArticle && allArticles.length > 0) {
                            matchedArticle = allArticles[0]; // fallback to first article
                        }
                    }
                }
            } catch(e) {}

            // 2. If not found in articles.json but ID is present, fetch live from TMDB & synthesize!
            if (!matchedArticle && query.id) {
                try {
                    const tmdbRes = await fetch(`https://api.themoviedb.org/3/${query.type}/${query.id}?api_key=${TMDB_API_KEY}&append_to_response=credits`);
                    if (tmdbRes.ok) {
                        const d = await tmdbRes.json();
                        const title = d.title || d.name || 'Featured Cinema';
                        const year = (d.release_date || d.first_air_date || '2026').split('-')[0];
                        matchedArticle = {
                            id: d.id,
                            mediaType: query.type,
                            title: title,
                            releaseYear: year,
                            rating: (d.vote_average || 7.5).toFixed(1),
                            voteCount: (d.vote_count || 500).toLocaleString(),
                            genres: (d.genres || []).map(g => g.name).join(', ') || 'Action',
                            director: d.credits?.crew?.find(c => c.job === 'Director')?.name || 'Acclaimed Director',
                            runtime: d.runtime ? `${d.runtime} mins` : '110 mins',
                            tagline: d.tagline || 'Experience the trending cinematic release.',
                            overview: d.overview || 'Stream this title in full high definition.',
                            posterUrl: d.poster_path ? `https://image.tmdb.org/t/p/w780${d.poster_path}` : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=780',
                            backdropUrl: d.backdrop_path ? `https://image.tmdb.org/t/p/w1280${d.backdrop_path}` : 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=1280',
                            h1Title: `Watch ${title} (${year}) Online Free in 1080p Full HD – Complete Streaming Guide & Cast Review`,
                            metaDesc: `Stream ${title} online free in 1080p Full HD with multi-subtitles and fast CDN mirrors. Read cast, plot, and rating on FlixStream.`,
                            keywords: [`Watch ${title} online free`, `${title} 1080p stream`, `${title} full movie`],
                            todayFormatted: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                            watchUrl: `watch.html?type=${query.type}&id=${d.id}&slug=${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`,
                            sections: [
                                {
                                    heading: `1. Overview & Streaming Specs for ${title}`,
                                    content: `<p>Watch <strong>${title}</strong> online in 1080p HD on FlixStream with multi-subtitles.</p>`
                                },
                                {
                                    heading: `2. Storyline & Synopsis`,
                                    content: `<p>${d.overview || 'Enjoy high octane drama and captivating storytelling.'}</p>`
                                }
                            ]
                        };
                    }
                } catch(e) {}
            }

            if (!matchedArticle) {
                document.getElementById('article-root').innerHTML = `
                    <div style="text-align: center; padding: 100px 20px;">
                        <h2 style="color: #fff; font-family: 'Outfit';">Article Not Found</h2>
                        <p style="color: #9ca3af; margin: 12px 0 24px;">Browse hundreds of trending movies on our home catalog.</p>
                        <a href="index.html" class="btn-giant-stream" style="display:inline-flex; width:auto;">Browse Full Catalog</a>
                    </div>
                `;
                return;
            }

            // Update Metadata & Head
            document.title = matchedArticle.h1Title;
            document.getElementById('page-title').innerText = matchedArticle.h1Title;
            document.getElementById('page-desc').setAttribute('content', matchedArticle.metaDesc);
            document.getElementById('page-canonical').setAttribute('href', window.location.href);
            
            const ogTitle = document.getElementById('og-title');
            if (ogTitle) ogTitle.setAttribute('content', matchedArticle.h1Title);
            const ogDesc = document.getElementById('og-desc');
            if (ogDesc) ogDesc.setAttribute('content', matchedArticle.metaDesc);
            const ogImg = document.getElementById('og-image');
            if (ogImg) ogImg.setAttribute('content', matchedArticle.backdropUrl);

            const topWatch = document.getElementById('top-watch-btn');
            if (topWatch) topWatch.setAttribute('href', matchedArticle.watchUrl);

            // Inject Schema.org JSON-LD if provided
            if (matchedArticle.schemaJson) {
                document.getElementById('schema-json-ld').textContent = JSON.stringify(matchedArticle.schemaJson);
            }

            // Render DOM
            document.getElementById('article-root').innerHTML = `
                <!-- Article Hero -->
                <div class="article-hero-wrap" style="background-image: linear-gradient(180deg, rgba(10,10,12,0.7) 0%, rgba(10,10,12,0.98) 100%), url('${matchedArticle.backdropUrl}');">
                    <div class="article-hero-inner">
                        <div class="article-badge-row">
                            <span class="badge-pill badge-trending">🔥 #1 TRENDING TODAY</span>
                            <span class="badge-pill badge-rating">⭐ ${matchedArticle.rating}/10 IMDb</span>
                            <span class="badge-pill badge-quality">1080P ULTRA HD</span>
                            <span class="badge-pill badge-date">Updated: ${matchedArticle.todayFormatted}</span>
                        </div>
                        
                        <h1 class="article-main-title">${matchedArticle.h1Title}</h1>
                        
                        <p class="article-lead-synopsis">${matchedArticle.metaDesc}</p>
                        
                        <div class="article-cta-box">
                            <a href="${matchedArticle.watchUrl}" class="btn-giant-stream">
                                <span class="play-pulse-icon">▶</span>
                                <span>Start Streaming ${matchedArticle.title} (1080p HD)</span>
                            </a>
                            <span class="stream-guarantee-text">⚡ Instant Fast Bufferless Mirror &bull; Multi-Subtitles &bull; Free Cinema Access</span>
                        </div>
                    </div>
                </div>

                <!-- Main Layout -->
                <main class="article-content-container">
                    <div class="article-main-column">
                        
                        <div class="article-poster-strip">
                            <img src="${matchedArticle.posterUrl}" alt="${matchedArticle.title} Official Poster" class="article-poster-thumb">
                            <div class="poster-strip-meta">
                                <h2>${matchedArticle.title} (${matchedArticle.releaseYear})</h2>
                                <p class="tagline-text">${matchedArticle.tagline || 'Experience the #1 trending title.'}</p>
                                <div class="pill-tags">
                                    <span>${matchedArticle.genres}</span>
                                    <span>${matchedArticle.runtime}</span>
                                    <span>Dir: ${matchedArticle.director}</span>
                                </div>
                            </div>
                        </div>

                        ${(matchedArticle.sections || []).map(sec => `
                            <section class="article-section-block">
                                <h2>${sec.heading}</h2>
                                ${sec.content}
                            </section>
                        `).join('')}

                        <div class="bottom-stream-card">
                            <h3>Ready to Watch ${matchedArticle.title}?</h3>
                            <p>Stream in crystal-clear 1080p Ultra HD with surround sound on any device.</p>
                            <a href="${matchedArticle.watchUrl}" class="btn-giant-stream btn-giant-bottom">
                                <span>▶ Launch Full Cinema Player</span>
                            </a>
                        </div>

                        <!-- Related Articles -->
                        <section class="related-seo-links">
                            <h3>Trending Movies & Series You Might Like</h3>
                            <div class="related-links-grid" id="related-links-grid">
                                ${(allArticles || []).filter(a => String(a.id) !== String(matchedArticle.id)).slice(0, 6).map(a => `
                                    <a href="article.html?id=${a.id}&slug=${a.slug}" class="related-link-card">
                                        <img src="${a.posterUrl}" alt="${a.title}" loading="lazy">
                                        <div>
                                            <strong>${a.title} (${a.releaseYear})</strong>
                                            <span>${a.genres} &bull; ⭐ ${a.rating}</span>
                                        </div>
                                    </a>
                                `).join('')}
                            </div>
                        </section>
                    </div>

                    <!-- Sidebar Sticky -->
                    <aside class="article-sidebar">
                        <div class="sidebar-sticky-card">
                            <img src="${matchedArticle.posterUrl}" alt="${matchedArticle.title} Poster" class="sidebar-poster">
                            <h4 class="sidebar-title">${matchedArticle.title}</h4>
                            <div class="sidebar-score">
                                <span class="score-num">${matchedArticle.rating}</span>
                                <span class="score-stars">⭐⭐⭐⭐⭐</span>
                                <span class="score-votes">${matchedArticle.voteCount} reviews</span>
                            </div>
                            <a href="${matchedArticle.watchUrl}" class="sidebar-play-btn">
                                <span>▶ Stream 1080p Now</span>
                            </a>
                            <div class="sidebar-feature-list">
                                <div>✓ Multi-Audio Tracks</div>
                                <div>✓ 1080p & 4K Adaptive CDN</div>
                                <div>✓ English / Arabic / French Subs</div>
                                <div>✓ No buffering or app install</div>
                            </div>
                        </div>
                    </aside>
                </main>
            `;
        }

        loadArticle();
    </script>
</body>
