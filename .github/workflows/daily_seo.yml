name: Daily Programmatic SEO Generator

on:
  schedule:
    # Runs every 4 hours automatically (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write # Needed to commit generated files back to git

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Programmatic SEO Generator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: "https://500get.com"
        run: |
          python generate_articles.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add movies/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No new movie articles were generated today. Repository is up-to-date."
          else
            git commit -m "chore(seo): auto-generate daily trending movie articles & sitemap [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
